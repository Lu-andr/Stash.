name: PeraGo Android test APK

on:
  push:
    branches: [master, offline-local]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - run: npm test
        working-directory: mobile
      - run: npm run check:local
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile
      - run: npx expo prebuild --platform android --no-install
        working-directory: mobile
        env:
          CI: '1'
      - run: ./gradlew :app:testReleaseUnitTest :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --max-workers=2 --console=plain
        working-directory: mobile/android
        env:
          NODE_ENV: production
      - name: Verify release manifest and PeraGo resources
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          candidates = list(Path('android/app/build/intermediates/merged_manifests').rglob('AndroidManifest.xml'))
          assert candidates, 'Merged manifest was not generated'
          key = '{http://schemas.android.com/apk/res/android}'
          for file in candidates:
              root = ET.parse(file).getroot()
              permissions = {p.get(key+'name') for p in root.findall('uses-permission')}
              assert {'android.permission.INTERNET', 'android.permission.ACCESS_NETWORK_STATE'} <= permissions
              activity = next(a for a in root.find('application').findall('activity') if a.get(key+'name').endswith('OfferWebViewActivity'))
              assert activity.get(key+'exported') == 'false'
              assert root.find('application').get(key+'allowBackup') == 'false'
          res = Path('android/app/src/main/res')
          for name in ['ic_launcher.xml', 'ic_launcher_round.xml']:
              icon = ET.parse(res/'mipmap-anydpi-v26'/name).getroot()
              assert icon.find('foreground').get(key+'drawable') == '@drawable/perago_launcher_foreground'
          inset = ET.parse(res/'drawable/perago_launcher_foreground.xml').getroot()
          assert all(inset.get(key+side) == '20%' for side in ['insetLeft', 'insetTop', 'insetRight', 'insetBottom'])
          assert (res/'drawable-mdpi/splashscreen_logo.png').is_file()
          print('Local backup policy, offers activity and PeraGo resources verified')
          PY
      - run: cp mobile/android/app/build/outputs/apk/release/app-release.apk PeraGo-1.1.3-test-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PeraGo-test-arm64
          path: PeraGo-1.1.3-test-arm64.apk
          if-no-files-found: error
          retention-days: 30
